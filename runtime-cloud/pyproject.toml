[project]
name = "levi-runtime-cloud"
version = "0.1.0"
description = "Dedicated cloud runtime for LiveKit and Pipecat call control"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "livekit>=1.1.2",
    "livekit-agents>=1.4.5",
    "pipecat-ai",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_cloud_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
